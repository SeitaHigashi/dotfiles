version = 1

; Device names come from `llama-server --list-devices` and are stable, unlike
; CUDA_VISIBLE_DEVICES indices (which are the reverse of nvidia-smi here):
;   CUDA0 = RTX 3060 Ti   (7839 MiB, sm_86, has tensor cores)
;   CUDA1 = GTX 1660 SUPER (5749 MiB, sm_75, no tensor cores — very slow at prompts)
[*]
jinja = true

; ---------------------------------------------------------------------------
; Bonsai 2, PTQ1_0, 3060 Ti alone. Measured best config on this host:
; full 32K context at 33.6 tok/s. Keeping every layer off the 1660 SUPER is
; worth 1.3-1.5x generation and 2.5-3.7x prompt throughput.
; ---------------------------------------------------------------------------
[bonsai]
model = /var/lib/llm-models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PTQ1_0.gguf
device = CUDA0
np = 1
ngl = 99
c = 16384
ctk = q8_0
ctv = q8_0
temp = 0.5
top-p = 0.85
top-k = 20

; Same weights plus the vision projector (+600 MB), so the context drops to 8192.
[bonsai-vision]
model = /var/lib/llm-models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PTQ1_0.gguf
mmproj = /var/lib/llm-models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
device = CUDA0
np = 1
ngl = 99
c = 8192
ctk = q8_0
ctv = q8_0
temp = 0.5
top-p = 0.85
top-k = 20

; PQ2_0 is the faster packing (40.7 vs 33.6 tok/s) but its extra 1.2 GB leaves
; room for only ~2K of context on one card. Kept for short-prompt work.
[bonsai-fast]
model = /var/lib/llm-models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PQ2_0.gguf
device = CUDA0
np = 1
ngl = 99
c = 2048
ctk = q8_0
ctv = q8_0

; Qwen3 embeddings on the 1660 SUPER, which the Bonsai presets no longer touch.
[embedding]
model = /var/lib/llm-models/Qwen3-Embedding-4B-GGUF/Qwen3-Embedding-4B-Q4_K_M.gguf
; np left at the default 4: embedding has no recurrent-state cache to multiply, and
; the extra slots help concurrent requests. Generation presets need np = 1.
device = CUDA1
embeddings = true
pooling = last
ngl = 99
c = 8192

; Gemma 4 12B (standard ggml-org GGUF; Ollama's own blobs are in Ollama's format
; and need its compat layer, so they can't be reused here). Needs both cards.
[gemma4]
model = /var/lib/llm-models/gemma-4-12B-it-GGUF/gemma-4-12B-it-Q4_0.gguf
mmproj = /var/lib/llm-models/gemma-4-12B-it-GGUF/mmproj-gemma-4-12B-it-Q8_0.gguf
np = 1
ngl = 99
c = 16384
split-mode = layer

; ---------------------------------------------------------------------------
; Long context, both cards. 144K is the GPU-resident ceiling here (155648 OOMs).
; Costs 40% of generation speed vs the single-card preset — the 1660 SUPER has
; no tensor cores, so every layer on it slows the whole pipeline.
; Run with BONSAI_MAX=1: this fills both GPUs, leaving no room for [embedding].
; ---------------------------------------------------------------------------
[bonsai-long]
model = /var/lib/llm-models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PTQ1_0.gguf
device = CUDA0,CUDA1
split-mode = layer
np = 1
ngl = 99
c = 147456
ctk = q8_0
ctv = q8_0
temp = 0.5
top-p = 0.85
top-k = 20

; The model's full 262144 context. The KV cache lives in system RAM (no-kv-offload),
; which costs 2.5x on generation (8.0 vs 20.1 tok/s). Only for prompts over ~144K.
[bonsai-max]
model = /var/lib/llm-models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PTQ1_0.gguf
device = CUDA0,CUDA1
split-mode = layer
no-kv-offload = true
np = 1
ngl = 99
c = 262144
ctk = q8_0
ctv = q8_0
temp = 0.5
top-p = 0.85
top-k = 20

; Gemma 4 at 32K, for n8n's Task Partner Brain: 13 tool schemas + an 8-turn buffer
; window + system prompt. 32768 is the value that workflow actually ran at before
; 2026-08-11, when everything was bumped to 163840 purely to stop Ollama reloading
; the model on num_ctx changes — a problem llama.cpp does not have.
[gemma4-32k]
model = /var/lib/llm-models/gemma-4-12B-it-GGUF/gemma-4-12B-it-Q4_0.gguf
mmproj = /var/lib/llm-models/gemma-4-12B-it-GGUF/mmproj-gemma-4-12B-it-Q8_0.gguf
ngl = 99
c = 32768
ctk = q8_0
ctv = q8_0
np = 1
split-mode = layer

; nomic-embed-text v1.5, 768-dim — the model Open WebUI's RAG already indexed with
; (RAG_EMBEDDING_MODEL in modules/ollama.nix:306). Kept so the Open WebUI cutover
; does not force a re-index of Knowledge collections; Qwen3 ([embedding]) is a
; different model at a different dimensionality and would.
[embedding-nomic]
model = /var/lib/llm-models/nomic-embed-text-v1.5-GGUF/nomic-embed-text-v1.5.Q8_0.gguf
device = CUDA1
embeddings = true
pooling = mean
ngl = 99
c = 8192
